<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>guest@yourname.dev:~</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&display=swap');

    :root {
      --bg: #0d0d0d;
      --text: #c8c8c8;
      --green: #39d353;
      --dim: #606060;
      --accent: #39d353;
      --white: #f0f0f0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 15px;
      line-height: 1.8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 56px 28px 100px;
    }

    #terminal {
      width: 100%;
      max-width: 820px;
    }

    .prompt {
      color: var(--green);
      font-weight: 500;
      text-shadow: 0 0 8px rgba(57, 211, 83, 0.4);
    }

    .np-row.playing .np-label::before {
      text-shadow: 0 0 8px rgba(57, 211, 83, 0.5);
    }

    .link-name {
      text-shadow: 0 0 8px rgba(57, 211, 83, 0.35);
    }

    .data-progress {
      text-shadow: 0 0 6px rgba(57, 211, 83, 0.3);
    }

    .cmd {
      color: var(--white);
    }

    .section {
      margin-top: 32px;
    }

    .whoami-name {
      color: var(--white);
      font-weight: 600;
    }

    .whoami-bio {
      color: var(--text);
    }

    /* ---- Spotify rows ---- */
    .np-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 8px;
      margin: 1px -8px;
      border-radius: 4px;
      cursor: default;
      transition: background 0.15s ease;
    }

    .np-row:hover {
      background: #ffffff;
    }

    .np-row:hover .np-label,
    .np-row:hover .np-time,
    .np-row:hover .np-now {
      color: #000000 !important;
      text-shadow: none;
    }

    .np-row.playing {
      font-weight: 600;
      color: var(--white);
    }

    .np-row.playing .np-label {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .np-row.playing .np-label::before {
      content: '▶';
      color: var(--green);
      font-size: 11px;
    }

    .np-row.history .np-label::before {
      content: '·';
      color: var(--dim);
      margin-right: 6px;
    }

    .np-row.history {
      color: var(--text);
    }

    .np-time {
      color: var(--dim);
      font-size: 12px;
      white-space: nowrap;
      margin-left: 16px;
      flex-shrink: 0;
    }

    .np-now {
      color: var(--dim);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      white-space: nowrap;
      margin-left: 16px;
      flex-shrink: 0;
    }

    /* ---- Letterboxd table ---- */
    .lb-header {
      display: grid;
      grid-template-columns: 90px 1fr 70px;
      color: var(--dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid #1e1e1e;
      padding-bottom: 6px;
      margin-bottom: 4px;
    }

    .lb-row {
      padding: 3px 0 2px;
      color: var(--text);
      border-bottom: 1px solid #1e1e1e;
    }

    .lb-main {
      display: grid;
      grid-template-columns: 130px 1fr 60px;
      padding: 5px 8px;
      margin: 1px -8px;
      border-radius: 4px;
      transition: background 0.15s ease, color 0.15s ease;
      cursor: default;
    }

    .lb-main:hover {
      background: #ffffff;
    }

    .lb-main:hover .lb-rating,
    .lb-main:hover .lb-title,
    .lb-main:hover .lb-year,
    .lb-main:hover .lb-toggle {
      color: #000000 !important;
      text-shadow: none;
    }

    .lb-rating {
      font-weight: 600;
      color: var(--white);
    }

    .lb-title {
      color: var(--white);
    }



    .lb-year {
      color: var(--dim);
      text-align: right;
    }

    .lb-review {
      color: #888;
      font-size: 13px;
      font-style: italic;
      padding: 0 8px 0 90px;
      line-height: 1.5;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease, padding 0.25s ease;
    }

    .lb-review.open {
      max-height: 100px;
      padding: 5px 8px 10px 90px;
      border-bottom: 1px solid #1e1e1e;
    }

    .lb-toggle {
      cursor: pointer;
      display: inline-block;
      transition: transform 0.2s ease, color 0.15s ease;
      color: var(--white);
      margin-right: 6px;
      user-select: none;
      font-size: 15px;
    }

    .lb-toggle.open {
      transform: rotate(90deg);
      color: var(--green);
    }

    /* ---- Books / Shows ---- */
    .data-header {
      display: grid;
      color: var(--dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid #1e1e1e;
      padding-bottom: 6px;
      margin-bottom: 4px;
    }

    .books-header { grid-template-columns: 2fr 1.5fr 100px 80px; }
    .shows-header { grid-template-columns: 3.5fr 100px 80px; }

    .data-row {
      display: grid;
      padding: 5px 8px;
      margin: 1px -8px;
      border-radius: 4px;
      transition: background 0.15s ease, color 0.15s ease;
      cursor: default;
    }

    .data-row:hover {
      background: #ffffff;
    }

    .data-row:hover .data-title,
    .data-row:hover .data-author,
    .data-row:hover .data-status,
    .data-row:hover .data-progress {
      color: #000000 !important;
      text-shadow: none;
    }

    .books-row { grid-template-columns: 2fr 1.5fr 100px 80px; }
    .shows-row { grid-template-columns: 3.5fr 100px 80px; }

    .data-title { color: var(--white); font-weight: 600; }
    .data-author { color: var(--text); }
    .data-status { color: var(--white); text-transform: uppercase; font-size: 13px; }
    .data-progress { color: var(--white); font-weight: 600; font-size: 13px; }

    /* ---- Links ---- */
    .link-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 3px 8px;
      margin: 1px -8px;
      border-radius: 4px;
      transition: background 0.15s ease;
    }

    .link-row:hover {
      background: #ffffff;
    }

    .link-row:hover .link-perms,
    .link-row:hover .link-name,
    .link-row:hover .link-arrow,
    .link-row:hover .link-url,
    .link-row:hover .link-url a {
      color: #000000 !important;
      text-shadow: none;
    }

    .link-perms { color: var(--dim); font-size: 12px; flex-shrink: 0; }
    .link-name { color: var(--green); flex-shrink: 0; text-shadow: 0 0 8px rgba(57, 211, 83, 0.35); }
    .link-arrow { color: var(--dim); flex-shrink: 0; }
    .link-url { color: var(--text); }
    .link-url a { color: var(--text); text-decoration: none; }
    .link-url a:hover { color: var(--white); }

    /* ---- Cursor ---- */
    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background: var(--green);
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .hidden { display: none; }
    .error-msg { color: #e06c75; }

        @media (max-width: 600px) {
      body { padding: 24px 16px 60px; font-size: 13px; }
      .lb-header, .lb-main { grid-template-columns: 90px 1fr 46px; }
      .lb-review { padding-left: 80px; }
      .books-header, .books-row { grid-template-columns: 2fr 1.5fr 70px 50px; }
      .shows-header, .shows-row { grid-template-columns: 3.5fr 80px 60px; }
    }
  </style>
</head>
<body>
<div id="terminal"></div>

<!-- DATA FILES — edit these directly -->
<script id="books-data" type="application/json">
[
  {
    "title": "Harry Potter and the Socerer's Stone",
    "author": "J.K. Rowling",
    "status": "reading",
    "progress": "40%"
  },
  {
    "title": "Cannery Row",
    "author": "John Steinbeck",
    "status": "reading",
    "progress": "5%"
  }
]
</script>

<script id="shows-data" type="application/json">
[
  {
    "title": "Batman Beyond",
    "network": "HBO",
    "status": "watching",
    "progress": "S3 E6"
  },
  {
    "title": "Soul Eater",
    "network": "Crunchyroll",
    "status": "watching",
    "progress": "E46"
  }
]
</script>

<script id="links-data" type="application/json">
[
  {
    "name": "instagram",
    "url": "https://instagram.com/nate.lokenvitz",
    "display": "https://instagram.com/nate.lokenvitz"
  },
  {
    "name": "letterboxd",
    "url": "https://letterboxd.com/natelokenvitz/",
    "display": "https://letterboxd.com/natelokenvitz/"
  }
]
</script>

<script>
// =============================================
// CONFIG — change these values
// =============================================
const CONFIG = {
  username: "whoami",
  domain: "nate.dev",
  name: "nate lokenvitz",
  bio: "stuff i am watching, reading, and listening to ",

  // Letterboxd RSS — replace with your username
  letterboxdUser: "natelokenvitz",

  // Spotify: set to true and fill in your worker URL after deploy
  // See README section below for setup instructions
  spotifyEnabled: false,
  spotifyWorkerUrl: "https://your-worker.yourname.workers.dev",
};
// =============================================

const terminal = document.getElementById('terminal');

// ---- Type a line, then call done() ----
function typeLine(text, cssClass, speed, done) {
  const span = document.createElement('span');
  if (cssClass) span.className = cssClass;
  terminal.appendChild(span);
  let i = 0;
  function step() {
    if (i < text.length) {
      span.textContent += text[i++];
      setTimeout(step, speed);
    } else {
      if (done) done();
    }
  }
  step();
}

function appendHTML(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  terminal.appendChild(div);
}

function appendEl(el) {
  terminal.appendChild(el);
}

function nl(n = 1) {
  for (let i = 0; i < n; i++) terminal.appendChild(document.createElement('br'));
}

function fmtDate(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  const day = String(d.getDate()).padStart(2, '0');
  const mon = d.toLocaleString('en', {month: 'short'}).toUpperCase();
  const yr = d.getFullYear();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${day} ${mon} ${yr}, ${hh}:${mm}`;
}

// ---- Fetch Letterboxd from our own worker (fast, cached server-side) ----
async function fetchLetterboxd() {
  const res = await fetch(CONFIG.spotifyWorkerUrl + '/letterboxd');
  const json = await res.json();
  return json.films || [];
}

// ---- Fetch Spotify via your Cloudflare Worker ----
async function fetchSpotify() {
  if (!CONFIG.spotifyEnabled) return null;
  try {
    const res = await fetch(CONFIG.spotifyWorkerUrl + '/spotify');
    return await res.json();
  } catch(e) {
    return null;
  }
}

// ---- Render now_playing section ----
function renderNowPlaying(data) {
  const div = document.createElement('div');

  if (!data) {
    // fallback static display
    div.innerHTML = `<div class="np-row playing">
      <span class="np-label">Spotify not connected</span>
      <span class="np-now">NOW PLAYING</span>
    </div>`;
    return div;
  }

  let html = '';
  if (data.current) {
    html += `<div class="np-row playing">
      <span class="np-label">${esc(data.current.track)} &mdash; ${esc(data.current.artist)}</span>
      <span class="np-now">NOW PLAYING</span>
    </div>`;
  }
  if (data.recent && data.recent.length) {
    data.recent.slice(0, 5).forEach(t => {
      html += `<div class="np-row history">
        <span class="np-label">${esc(t.track)} &mdash; ${esc(t.artist)}</span>
        <span class="np-time">${fmtDate(t.played_at)}</span>
      </div>`;
    });
  }
  div.innerHTML = html;
  return div;
}

// ---- Render Letterboxd ----
function renderLetterboxd(films) {
  const div = document.createElement('div');
  let html = `<div class="lb-header lb-main"><span>RATING</span><span>TITLE</span><span>YEAR</span></div>`;
  films.forEach((f, i) => {
    const hasReview = !!f.review;
    const toggleHtml = hasReview
      ? `<span class="lb-toggle" data-idx="${i}" title="Toggle review">▸</span>`
      : `<span style="color:var(--dim);margin-right:6px;font-size:15px">▸</span>`;
    html += `<div class="lb-row">
      <div class="lb-main">
        <span class="lb-rating">${f.rating ? esc(f.rating) : '—'}</span>
        <span class="lb-title">${toggleHtml}${esc(f.title)}</span>
        <span class="lb-year">${esc(f.year)}</span>
      </div>`;
    if (hasReview) {
      html += `<div class="lb-review" data-review="${i}">${esc(f.review)}</div>`;
    }
    html += `</div>`;
  });
  div.innerHTML = html;

  // Wire up toggles
  div.querySelectorAll('.lb-toggle').forEach(toggle => {
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = toggle.dataset.idx;
      const review = div.querySelector(`.lb-review[data-review="${idx}"]`);
      const isOpen = review.classList.contains('open');
      review.classList.toggle('open', !isOpen);
      toggle.classList.toggle('open', !isOpen);
    });
  });

  return div;
}

// ---- Render Books ----
function renderBooks(books) {
  const div = document.createElement('div');
  let html = `<div class="data-header books-header"><span>TITLE</span><span>AUTHOR</span><span>STATUS</span><span>PROGRESS</span></div>`;
  books.forEach(b => {
    html += `<div class="data-row books-row">
      <span class="data-title">${esc(b.title)}</span>
      <span class="data-author">${esc(b.author)}</span>
      <span class="data-status">${esc(b.status)}</span>
      <span class="data-progress">${esc(b.progress)}</span>
    </div>`;
  });
  div.innerHTML = html;
  return div;
}

// ---- Render Shows ----
function renderShows(shows) {
  const div = document.createElement('div');
  let html = `<div class="data-header shows-header"><span>TITLE</span><span>STATUS</span><span>PROGRESS</span></div>`;
  shows.forEach(s => {
    html += `<div class="data-row shows-row">
      <span class="data-title">${esc(s.title)}</span>
      <span class="data-status">${esc(s.status)}</span>
      <span class="data-progress">${esc(s.progress)}</span>
    </div>`;
  });
  div.innerHTML = html;
  return div;
}

// ---- Render Links ----
function renderLinks(links) {
  const div = document.createElement('div');
  let html = '';
  links.forEach(l => {
    html += `<div class="link-row">
      <span class="link-perms">drwxr-xr-x 1 ${esc(CONFIG.name)} ${esc(CONFIG.name)} 4096 Apr 12 13:37</span>
      <span class="link-name">${esc(l.name)}</span>
      <span class="link-arrow">-&gt;</span>
      <span class="link-url"><a href="${esc(l.url)}" target="_blank">${esc(l.display)}</a></span>
    </div>`;
  });
  div.innerHTML = html;
  return div;
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---- Main sequence ----
async function main() {
  const books = JSON.parse(document.getElementById('books-data').textContent);
  const shows = JSON.parse(document.getElementById('shows-data').textContent);
  const links = JSON.parse(document.getElementById('links-data').textContent);

  // Prefetch async data while typing happens
  const spotifyPromise = fetchSpotify();
  const letterboxdPromise = fetchLetterboxd().catch(() => null);

  const promptStr = `guest@${CONFIG.domain}:~`;
  const typeSpeed = 28;

  // ---- Section 1: whoami ----
  typeLine(promptStr, 'prompt', typeSpeed, () => {
    typeLine('$ whoami', 'cmd', typeSpeed, () => {
      nl();
      typeLine(CONFIG.name, 'whoami-name', typeSpeed, () => {
        nl();
        typeLine(CONFIG.bio, 'whoami-bio', typeSpeed, () => {
          nl(2);
          // ---- Section 2: now_playing ----
          typeLine(promptStr, 'prompt', typeSpeed, () => {
            typeLine('$ ./now_playing.sh', 'cmd', typeSpeed, async () => {
              nl();
              const spotifyLoading = document.createElement('span');
              spotifyLoading.style.color = 'var(--dim)';
              spotifyLoading.style.fontStyle = 'italic';
              spotifyLoading.textContent = 'fetching data...';
              if (CONFIG.spotifyEnabled) appendEl(spotifyLoading);
              const spotify = await spotifyPromise;
              if (CONFIG.spotifyEnabled) spotifyLoading.remove();
              appendEl(renderNowPlaying(spotify));
              nl(2);
              // ---- Section 3: letterboxd ----
              typeLine(promptStr, 'prompt', typeSpeed, () => {
                typeLine(`$ cat ~/.letterboxd/recent`, 'cmd', typeSpeed, async () => {
                  nl();
                  // Show loading indicator immediately
                  const loadingEl = document.createElement('span');
                  loadingEl.style.color = 'var(--dim)';
                  loadingEl.style.fontStyle = 'italic';
                  loadingEl.textContent = 'fetching data...';
                  appendEl(loadingEl);
                  const films = await letterboxdPromise;
                  // Remove loading indicator
                  loadingEl.remove();
                  if (films && films.length) {
                    appendEl(renderLetterboxd(films));
                  } else {
                    const err = document.createElement('span');
                    err.className = 'error-msg';
                    err.textContent = 'could not reach letterboxd RSS — check your username in CONFIG';
                    appendEl(err);
                  }
                  nl(2);
                  // ---- Section 4: books ----
                  typeLine(promptStr, 'prompt', typeSpeed, () => {
                    typeLine('$ cat ~/books.json', 'cmd', typeSpeed, () => {
                      nl();
                      appendEl(renderBooks(books));
                      nl(2);
                      // ---- Section 5: shows ----
                      typeLine(promptStr, 'prompt', typeSpeed, () => {
                        typeLine('$ cat ~/shows.json', 'cmd', typeSpeed, () => {
                          nl();
                          appendEl(renderShows(shows));
                          nl(2);
                          // ---- Section 6: links ----
                          typeLine(promptStr, 'prompt', typeSpeed, () => {
                            typeLine('$ ls -l ~/links', 'cmd', typeSpeed, () => {
                              nl();
                              appendEl(renderLinks(links));
                              nl(2);
                              // Final prompt + cursor
                              const p = document.createElement('span');
                              p.className = 'prompt';
                              p.textContent = promptStr + '$ ';
                              appendEl(p);
                              const cur = document.createElement('span');
                              cur.className = 'cursor';
                              appendEl(cur);
                            });
                          });
                        });
                      });
                    });
                  });
                });
              });
            });
          });
        });
      });
    });
  });
}

main();
</script>
</body>
</html>
