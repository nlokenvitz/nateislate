<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>guest@yourname.dev:~</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&display=swap');

    :root {
      --bg: #0d0d0d;
      --text: #c8c8c8;
      --green: #4af626;
      --dim: #555;
      --accent: #7fff7f;
      --white: #f0f0f0;
      --now-playing: #c8c8c8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 24px 80px;
    }

    #terminal {
      width: 100%;
      max-width: 860px;
    }

    .prompt {
      color: var(--green);
      font-weight: 600;
    }

    .cmd {
      color: var(--white);
    }

    .section {
      margin-top: 28px;
    }

    /* whoami output */
    .whoami-name {
      color: var(--white);
      font-weight: 600;
    }

    .whoami-bio {
      color: var(--text);
    }

    /* now playing table */
    .np-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 4px;
    }

    .np-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1px 0;
    }

    .np-row.playing {
      font-weight: 700;
      color: var(--white);
    }

    .np-row.playing .np-label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .np-row.playing .np-label::before {
      content: '▶';
      color: var(--green);
    }

    .np-row.history .np-label::before {
      content: '·';
      color: var(--dim);
      margin-right: 4px;
    }

    .np-row.history {
      color: var(--text);
    }

    .np-time {
      color: var(--dim);
      font-size: 13px;
      white-space: nowrap;
      margin-left: 16px;
    }

    .np-now {
      color: var(--dim);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
      margin-left: 16px;
    }

    /* letterboxd table */
    .lb-header {
      display: grid;
      grid-template-columns: 100px 1fr 80px;
      color: var(--dim);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid #222;
      padding-bottom: 4px;
      margin-bottom: 2px;
    }

    .lb-row {
      display: grid;
      grid-template-columns: 100px 1fr 80px;
      padding: 2px 0;
      color: var(--text);
    }

    .lb-rating {
      font-weight: 700;
      color: var(--white);
    }

    .lb-title {
      color: var(--text);
    }

    .lb-title::before {
      content: '▸ ';
      color: var(--dim);
    }

    .lb-year {
      color: var(--dim);
    }

    /* books / shows table */
    .data-header {
      display: grid;
      color: var(--dim);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid #222;
      padding-bottom: 4px;
      margin-bottom: 2px;
    }

    .books-header { grid-template-columns: 220px 160px 90px 80px; }
    .shows-header { grid-template-columns: 260px 90px 100px; }

    .data-row {
      display: grid;
      padding: 2px 0;
    }

    .books-row { grid-template-columns: 220px 160px 90px 80px; }
    .shows-row { grid-template-columns: 260px 90px 100px; }

    .data-title { color: var(--white); font-weight: 600; }
    .data-author { color: var(--text); }
    .data-status { color: var(--dim); text-transform: uppercase; font-size: 12px; }
    .data-progress { color: var(--accent); font-weight: 600; }

    /* links table */
    .link-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 1px 0;
    }

    .link-perms { color: var(--dim); font-size: 12px; }
    .link-name { color: var(--green); }
    .link-arrow { color: var(--dim); }
    .link-url { color: var(--text); }
    .link-url a { color: var(--text); text-decoration: none; }
    .link-url a:hover { color: var(--accent); text-decoration: underline; }

    /* cursor */
    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: var(--green);
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .hidden { display: none; }

    /* loading state */
    .loading-dots::after {
      content: '';
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
    }

    .error-msg { color: #ff6b6b; }

    @media (max-width: 600px) {
      body { padding: 20px 16px 60px; font-size: 12px; }
      .lb-header, .lb-row { grid-template-columns: 80px 1fr 60px; }
      .books-header, .books-row { grid-template-columns: 140px 110px 70px 60px; }
      .shows-header, .shows-row { grid-template-columns: 160px 70px 80px; }
    }
  </style>
</head>
<body>
<div id="terminal"></div>

<!-- DATA FILES — edit these directly -->
<script id="books-data" type="application/json">
[
  {
    "title": "Harry Potter and the Socerer's Stone",
    "author": "J.K. Rowling",
    "status": "reading",
    "progress": "40%"
  },
  {
    "title": "Cannery Row",
    "author": "John Steinbeck",
    "status": "reading",
    "progress": "5%"
  }
]
</script>

<script id="shows-data" type="application/json">
[
  {
    "title": "Batman Beyond",
    "network": "HBO",
    "status": "watching",
    "progress": "S3 E6"
  },
  {
    "title": "Soul Eater",
    "network": "Crunchyroll",
    "status": "watching",
    "progress": "E46"
  }
]
</script>

<script id="links-data" type="application/json">
[
  {
    "name": "instagram",
    "url": "https://instagram.com/nate.lokenvitz",
    "display": "https://instagram.com/nate.lokenvitz"
  },
  {
    "name": "letterboxd",
    "url": "https://letterboxd.com/natelokenvitz/",
    "display": "https://letterboxd.com/natelokenvitz/"
  }
]
</script>

<script>
// =============================================
// CONFIG — change these values
// =============================================
const CONFIG = {
  username: "whoami",
  domain: "nate.dev",
  name: "nate lokenvitz",
  bio: "stuff i am watching, reading, and listening to ",

  // Letterboxd RSS — replace with your username
  letterboxdUser: "natelokenvitz",

  // Spotify: set to true and fill in your worker URL after deploy
  // See README section below for setup instructions
  spotifyEnabled: false,
  spotifyWorkerUrl: "https://your-worker.yourname.workers.dev",
};
// =============================================

const terminal = document.getElementById('terminal');

// ---- Type a line, then call done() ----
function typeLine(text, cssClass, speed, done) {
  const span = document.createElement('span');
  if (cssClass) span.className = cssClass;
  terminal.appendChild(span);
  let i = 0;
  function step() {
    if (i < text.length) {
      span.textContent += text[i++];
      setTimeout(step, speed);
    } else {
      if (done) done();
    }
  }
  step();
}

function appendHTML(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  terminal.appendChild(div);
}

function appendEl(el) {
  terminal.appendChild(el);
}

function nl(n = 1) {
  for (let i = 0; i < n; i++) terminal.appendChild(document.createElement('br'));
}

function fmtDate(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  const day = String(d.getDate()).padStart(2, '0');
  const mon = d.toLocaleString('en', {month: 'short'}).toUpperCase();
  const yr = d.getFullYear();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${day} ${mon} ${yr}, ${hh}:${mm}`;
}

// ---- Parse Letterboxd RSS ----
async function fetchLetterboxd() {
  const rssUrl = `https://letterboxd.com/${CONFIG.letterboxdUser}/rss/`;
  // Try fast proxy first, fall back to allorigins
  let xmlText;
  try {
    const r1 = await fetch(`https://corsproxy.io/?${encodeURIComponent(rssUrl)}`);
    xmlText = await r1.text();
  } catch(e) {
    const r2 = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`);
    const j = await r2.json();
    xmlText = j.contents;
  }
  const parser = new DOMParser();
  const xml = parser.parseFromString(xmlText, 'text/xml');
  const items = [...xml.querySelectorAll('item')].slice(0, 5);
  return items.map(item => {
    const title = item.querySelector('title')?.textContent || '';
    // title format: "Film Name, year - rating"
    const match = title.match(/^(.+),\s*(\d{4})\s*-\s*([\d.]+)/);
    let filmTitle = title, year = '', rating = '';
    if (match) {
      filmTitle = match[1].trim();
      year = match[2];
      const stars = parseFloat(match[3]);
      rating = (stars).toFixed(1) + '/5';
    }
    return { title: filmTitle, year, rating };
  });
}

// ---- Fetch Spotify via your Cloudflare Worker ----
async function fetchSpotify() {
  if (!CONFIG.spotifyEnabled) return null;
  try {
    const res = await fetch(CONFIG.spotifyWorkerUrl + '/spotify');
    return await res.json();
  } catch(e) {
    return null;
  }
}

// ---- Render now_playing section ----
function renderNowPlaying(data) {
  const div = document.createElement('div');

  if (!data) {
    // fallback static display
    div.innerHTML = `<div class="np-row playing">
      <span class="np-label">Spotify not connected</span>
      <span class="np-now">NOW PLAYING</span>
    </div>`;
    return div;
  }

  let html = '';
  if (data.current) {
    html += `<div class="np-row playing">
      <span class="np-label">${esc(data.current.track)} &mdash; ${esc(data.current.artist)}</span>
      <span class="np-now">NOW PLAYING</span>
    </div>`;
  }
  if (data.recent && data.recent.length) {
    data.recent.slice(0, 5).forEach(t => {
      html += `<div class="np-row history">
        <span class="np-label">${esc(t.track)} &mdash; ${esc(t.artist)}</span>
        <span class="np-time">${fmtDate(t.played_at)}</span>
      </div>`;
    });
  }
  div.innerHTML = html;
  return div;
}

// ---- Render Letterboxd ----
function renderLetterboxd(films) {
  const div = document.createElement('div');
  let html = `<div class="lb-header"><span>RATING</span><span>TITLE</span><span>YEAR</span></div>`;
  films.forEach(f => {
    html += `<div class="lb-row">
      <span class="lb-rating">${esc(f.rating || '—')}</span>
      <span class="lb-title">${esc(f.title)}</span>
      <span class="lb-year">${esc(f.year)}</span>
    </div>`;
  });
  div.innerHTML = html;
  return div;
}

// ---- Render Books ----
function renderBooks(books) {
  const div = document.createElement('div');
  let html = `<div class="data-header books-header"><span>TITLE</span><span>AUTHOR</span><span>STATUS</span><span>PROGRESS</span></div>`;
  books.forEach(b => {
    html += `<div class="data-row books-row">
      <span class="data-title">${esc(b.title)}</span>
      <span class="data-author">${esc(b.author)}</span>
      <span class="data-status">${esc(b.status)}</span>
      <span class="data-progress">${esc(b.progress)}</span>
    </div>`;
  });
  div.innerHTML = html;
  return div;
}

// ---- Render Shows ----
function renderShows(shows) {
  const div = document.createElement('div');
  let html = `<div class="data-header shows-header"><span>TITLE</span><span>STATUS</span><span>PROGRESS</span></div>`;
  shows.forEach(s => {
    html += `<div class="data-row shows-row">
      <span class="data-title">${esc(s.title)}</span>
      <span class="data-status">${esc(s.status)}</span>
      <span class="data-progress">${esc(s.progress)}</span>
    </div>`;
  });
  div.innerHTML = html;
  return div;
}

// ---- Render Links ----
function renderLinks(links) {
  const div = document.createElement('div');
  let html = '';
  links.forEach(l => {
    html += `<div class="link-row">
      <span class="link-perms">drwxr-xr-x 1 ${esc(CONFIG.name)} ${esc(CONFIG.name)} 4096 Apr 12 13:37</span>
      <span class="link-name">${esc(l.name)}</span>
      <span class="link-arrow">-&gt;</span>
      <span class="link-url"><a href="${esc(l.url)}" target="_blank">${esc(l.display)}</a></span>
    </div>`;
  });
  div.innerHTML = html;
  return div;
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---- Main sequence ----
async function main() {
  const books = JSON.parse(document.getElementById('books-data').textContent);
  const shows = JSON.parse(document.getElementById('shows-data').textContent);
  const links = JSON.parse(document.getElementById('links-data').textContent);

  // Prefetch async data while typing happens
  const spotifyPromise = fetchSpotify();
  const letterboxdPromise = fetchLetterboxd().catch(() => null);

  const promptStr = `guest@${CONFIG.domain}:~`;
  const typeSpeed = 28;

  // ---- Section 1: whoami ----
  typeLine(promptStr, 'prompt', typeSpeed, () => {
    typeLine('$ whoami', 'cmd', typeSpeed, () => {
      nl();
      typeLine(CONFIG.name, 'whoami-name', typeSpeed, () => {
        nl();
        typeLine(CONFIG.bio, 'whoami-bio', typeSpeed, () => {
          nl(2);
          // ---- Section 2: now_playing ----
          typeLine(promptStr, 'prompt', typeSpeed, () => {
            typeLine('$ ./now_playing.sh', 'cmd', typeSpeed, async () => {
              nl();
              const spotify = await spotifyPromise;
              appendEl(renderNowPlaying(spotify));
              nl(2);
              // ---- Section 3: letterboxd ----
              typeLine(promptStr, 'prompt', typeSpeed, () => {
                typeLine(`$ cat ~/.letterboxd/recent`, 'cmd', typeSpeed, async () => {
                  nl();
                  const films = await letterboxdPromise;
                  if (films && films.length) {
                    appendEl(renderLetterboxd(films));
                  } else {
                    const err = document.createElement('span');
                    err.className = 'error-msg';
                    err.textContent = 'could not reach letterboxd RSS — check your username in CONFIG';
                    appendEl(err);
                  }
                  nl(2);
                  // ---- Section 4: books ----
                  typeLine(promptStr, 'prompt', typeSpeed, () => {
                    typeLine('$ cat ~/books.json', 'cmd', typeSpeed, () => {
                      nl();
                      appendEl(renderBooks(books));
                      nl(2);
                      // ---- Section 5: shows ----
                      typeLine(promptStr, 'prompt', typeSpeed, () => {
                        typeLine('$ cat ~/shows.json', 'cmd', typeSpeed, () => {
                          nl();
                          appendEl(renderShows(shows));
                          nl(2);
                          // ---- Section 6: links ----
                          typeLine(promptStr, 'prompt', typeSpeed, () => {
                            typeLine('$ ls -l ~/links', 'cmd', typeSpeed, () => {
                              nl();
                              appendEl(renderLinks(links));
                              nl(2);
                              // Final prompt + cursor
                              const p = document.createElement('span');
                              p.className = 'prompt';
                              p.textContent = promptStr + '$ ';
                              appendEl(p);
                              const cur = document.createElement('span');
                              cur.className = 'cursor';
                              appendEl(cur);
                            });
                          });
                        });
                      });
                    });
                  });
                });
              });
            });
          });
        });
      });
    });
  });
}

main();
</script>
</body>
</html>
